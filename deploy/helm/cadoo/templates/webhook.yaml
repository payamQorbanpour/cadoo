{{- if .Values.webhook.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cadoo.fullname" . }}-webhook
  labels:
    {{- include "cadoo.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  replicas: {{ .Values.webhook.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: webhook
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "cadoo.labels" . | nindent 8 }}
        app.kubernetes.io/component: webhook
    spec:
      containers:
        - name: webhook
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["cadoo-webhook"]
          ports:
            - containerPort: 8081
          env:
            - name: HTTP_ADDR
              value: ":8081"
            {{- include "cadoo.envList" . | nindent 12 }}
          envFrom:
            {{- include "cadoo.envFromList" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cadoo.fullname" . }}-webhook
  labels:
    {{- include "cadoo.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  type: {{ .Values.webhook.service.type }}
  ports:
    - port: {{ .Values.webhook.service.port }}
      targetPort: 8081
  selector:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.webhook.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cadoo.fullname" . }}-webhook
  labels:
    {{- include "cadoo.labels" . | nindent 4 }}
spec:
  {{- with .Values.webhook.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.webhook.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cadoo.fullname" . }}-webhook
                port:
                  number: {{ .Values.webhook.service.port }}
  {{- if .Values.webhook.ingress.tls }}
  tls:
    - hosts: [ {{ .Values.webhook.ingress.host | quote }} ]
      secretName: {{ include "cadoo.fullname" . }}-webhook-tls
  {{- end }}
{{- end }}
{{- end }}
