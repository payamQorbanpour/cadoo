{{- if .Values.hardening.serviceMonitor.enabled }}
{{- if .Values.api.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cadoo.fullname" . }}-api
  labels:
    {{- include "cadoo.labels" . | nindent 4 }}
    {{- with .Values.hardening.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.hardening.serviceMonitor.interval }}
{{- end }}
{{- end }}
