# LiteLLM proxy config. The Cadoo Go service calls this proxy via an
# OpenAI-compatible HTTP API; LiteLLM routes to the underlying provider.
# Add or remove model entries here without redeploying Cadoo.

model_list:
  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true
  # Keep in sync with (or above) LLM_GATEWAY_TIMEOUT_SECONDS on the Go side
  # (internal/llm/litellm/client.go) — if this is lower, the proxy errors out
  # before the Go client's own timeout ever gets a chance to matter.
  request_timeout: 120

general_settings:
  master_key: sk-cadoo-dev-only
