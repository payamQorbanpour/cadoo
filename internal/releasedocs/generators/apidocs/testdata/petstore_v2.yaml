swagger: "2.0"
info:
  title: Petstore
  description: A sample Swagger 2.0 petstore API for testing.
  version: "1.0.0"
host: petstore.example.com
basePath: /v1
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
tags:
  - name: pets
    description: Operations about pets
  - name: store
    description: Operations about the store
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          required: false
          type: integer
          format: int32
      responses:
        "200":
          description: A list of pets
          schema:
            type: array
            items:
              $ref: "#/definitions/Pet"
        "400":
          description: Bad request
    post:
      summary: Create a pet
      operationId: createPet
      tags:
        - pets
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/NewPet"
      responses:
        "201":
          description: Pet created
          schema:
            $ref: "#/definitions/Pet"
  /pets/{id}:
    get:
      summary: Get a pet by ID
      operationId: getPetById
      tags:
        - pets
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int64
          description: The pet ID
      responses:
        "200":
          description: The pet
          schema:
            $ref: "#/definitions/Pet"
        "404":
          description: Pet not found
    delete:
      summary: Delete a pet
      operationId: deletePet
      tags:
        - pets
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int64
      responses:
        "204":
          description: Pet deleted
  /store/inventory:
    get:
      summary: Get store inventory
      operationId: getInventory
      tags:
        - store
      responses:
        "200":
          description: Inventory counts by status
          schema:
            type: object
            additionalProperties:
              type: integer
definitions:
  Pet:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: integer
        format: int64
        description: Unique identifier for the pet
      name:
        type: string
        description: The pet's name
      tag:
        type: string
        description: Optional tag
  NewPet:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        description: The pet's name
      tag:
        type: string
        description: Optional tag
