openapi: 3.0.3
info:
  title: Petstore
  description: A sample OAS 3.0 petstore API for testing.
  version: "1.0.0"
  contact:
    name: Petstore Support
    email: support@petstore.example.com
servers:
  - url: https://petstore.example.com/v1
    description: Production server
tags:
  - name: pets
    description: Operations about pets
  - name: store
    description: Operations about the store
paths:
  /pets:
    get:
      summary: List all pets
      description: Returns a paginated list of all pets in the store.
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return (max 100)
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
        - name: offset
          in: query
          description: Pagination offset
          required: false
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a pet
      description: Creates a new pet in the store.
      operationId: createPet
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{id}:
    get:
      summary: Get a pet by ID
      description: Returns a single pet identified by its numeric ID.
      operationId: getPetById
      tags:
        - pets
      parameters:
        - name: id
          in: path
          required: true
          description: The pet's unique identifier
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a pet
      description: Replaces a pet's data by ID.
      operationId: updatePet
      tags:
        - pets
      parameters:
        - name: id
          in: path
          required: true
          description: The pet's unique identifier
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "200":
          description: Updated pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    delete:
      summary: Delete a pet
      description: Removes a pet from the store by ID.
      operationId: deletePet
      tags:
        - pets
      parameters:
        - name: id
          in: path
          required: true
          description: The pet's unique identifier
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Pet deleted successfully
        "404":
          description: Pet not found
  /store/inventory:
    get:
      summary: Get store inventory
      description: Returns a map of status codes to quantities.
      operationId: getInventory
      tags:
        - store
      responses:
        "200":
          description: Inventory map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
  /store/orders:
    post:
      summary: Place an order
      description: Places a new order for a pet.
      operationId: placeOrder
      tags:
        - store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the pet
        name:
          type: string
          description: The pet's name
        tag:
          type: string
          description: An optional classification tag
        status:
          type: string
          description: Pet availability status
          enum:
            - available
            - pending
            - sold
    NewPet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The pet's name
        tag:
          type: string
          description: An optional classification tag
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - placed
            - approved
            - delivered
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
