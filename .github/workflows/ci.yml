name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: vet
        run: go vet ./...
      - name: build
        run: make build
      - name: test
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: cadoo
          POSTGRES_USER: cadoo
          POSTGRES_DB: cadoo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cadoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - name: apply migrations up and down
        env:
          DATABASE_URL: postgres://cadoo:cadoo@localhost:5432/cadoo?sslmode=disable
        run: |
          goose -dir db/migrations postgres "$DATABASE_URL" up
          goose -dir db/migrations postgres "$DATABASE_URL" down
          goose -dir db/migrations postgres "$DATABASE_URL" up
